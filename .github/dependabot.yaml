version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      # Every version update, majors included, in one PR; CI runs the actions it bumps.
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    ignore:
      # flutter_soloud 5 removed AudioData and GetSamplesKind, which lib/audio uses (#27 broke analyze).
      # update-types limits this to version updates; security updates still open.
      - dependency-name: flutter_soloud
        update-types:
          - version-update:semver-major
